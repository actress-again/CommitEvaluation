#最小文字数
rule.min_length.enabled=true
rule.min_length.penalty=20
rule.min_length.value=10

#最大文字数
rule.max_length.enabled=true
rule.max_length.penalty=10
rule.max_length.value=72

#プレフィックス
rule.prefix.enabled=true
rule.prefix.penalty=25
rule.prefix.values=feat:,fix:,docs:,refactor:,test:,chore:

#チケット
rule.ticket_number.enabled=false
rule.ticket_number.penalty=30
rule.ticket_number.pattern=#\\d+

#文末ピリオド
rule.no_ending_period.enabled=true
rule.no_ending_period.penalty=5

#NGワード
rule.ng_words.enabled=true
rule.ng_words.penalty=15
rule.ng_words.list=バグ修正,微調整,コミット,commit,wip
